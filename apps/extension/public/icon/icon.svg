<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="0.5" stop-color="#2563EB" />
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fish-grad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="12" y="18" width="104" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)" />

  <!-- Fish + AI Agent Icon with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Fish Body -->
    <path d="M28 64C42 44 64 38 88 44C82 56 82 72 88 84C64 90 42 84 28 64Z" fill="url(#fish-grad)" />
    <!-- Fish Tail Fin -->
    <path d="M88 64L104 48V80L88 64Z" fill="url(#fish-grad)" />
    <!-- Dorsal Fin Accent -->
    <path d="M52 41C60 33 72 32 80 36C75 41 68 43 52 41Z" fill="#93C5FD" />
    <!-- Fish Eye -->
    <circle cx="48" cy="58" r="6" fill="#1D4ED8" />
    <circle cx="46" cy="56" r="2" fill="#FFFFFF" />
    <!-- Subtle Smile / Gill Accent -->
    <path d="M60 62C65 64 70 64 74 62" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
